services:
  postgres:
    image: postgres:16-alpine
    container_name: medkart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medkart
      POSTGRES_PASSWORD: medkart_dev
      POSTGRES_DB: medkart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

